<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f5c">
  <title>Director IA · Decisiones · Cine Financiero</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logos-bancoppel-afore.png">
</head>
<body>
  <div class="stage">

    <!-- Decoración de fondo -->
    <div class="bg-deco" aria-hidden="true">
      <div class="circle-1"></div>
      <div class="circle-2"></div>
      <div class="circle-3"></div>
      <div class="circle-4"></div>
    </div>

    <!-- Film strip superior -->
    <div class="film-strip" aria-hidden="true"></div>

    <!-- Header -->
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand-logo">
          <img src="assets/logos-bancoppel-afore.png" alt="BanCoppel | Afore Coppel">
        </div>
        <div class="section-tag">
          <span class="clapper-icon">
            <svg viewBox="0 0 24 24" width="62%" height="62%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 10h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <path d="m3.4 9.7-.6-2.4a1 1 0 0 1 .7-1.2l15-3.9a1 1 0 0 1 1.2.7l.6 2.4z"/>
              <path d="m7.5 5 2.6 3.4M12.5 3.7l2.6 3.4"/>
              <path d="m12 12.6.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z"/>
            </svg>
          </span>
          Decisiones <span class="yellow-dot">·</span> 4
        </div>
      </div>
    </header>

    <!-- Body -->
    <section class="stage-body">
      <div class="screen-grid">

        <!-- Columna izquierda -->
        <div class="screen-text">
          <span class="eyebrow">
            <span class="dot-red"></span>
            Grabando · Estación 4
          </span>
          <h1 class="t-hero">
            Escanea tu<br>
            <span class="underline-anim">Pase de Rodaje</span>
          </h1>
          <p class="t-body">Acerca el QR a la cámara o escribe la clave de tu pase.</p>
        </div>

        <!-- Columna derecha: viewfinder + input -->
        <div class="screen-cam">
          <div class="viewfinder" id="viewfinder">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <button class="camera-btn" id="cameraBtn" type="button" aria-label="Encender la cámara">
              <span class="ring">
                <svg viewBox="0 0 24 24" width="56%" height="56%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 8a2 2 0 0 1 2-2h1.5l1.4-2h6.2l1.4 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
                  <circle cx="12" cy="12.5" r="3.6"/>
                </svg>
              </span>
            </button>
          </div>

          <div class="viewfinder-status" id="camStatus">Toca para encender la cámara</div>

          <div class="separator">o ingresa tu clave</div>

          <form class="input-row" id="keyForm">
            <span class="key-icon">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="15" r="4"/>
                <path d="m10.8 12.2 8.7-8.7M16 7l2.5 2.5M13.5 9.5 16 12"/>
              </svg>
            </span>
            <input id="keyInput" type="text" placeholder="Clave del pase" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="6" enterkeyhint="go">
          </form>

          <div class="error-msg" id="keyError"></div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-block">
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 5 6v5.5c0 4.3 3 7.9 7 9.5 4-1.6 7-5.2 7-9.5V6z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </span>
        <p class="text-navy">Tu información está protegida.<br>Consulta el Aviso de privacidad.</p>
      </div>
      <div class="footer-block">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="var(--color-yellow-deep)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 21h4"/>
          <path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>
        </svg>
        <p>
          <span class="label text-blue">Tip del Director</span>
          <span class="italic text-blue">Tú eres el protagonista.</span>
        </p>
      </div>
    </footer>
  </div>

  <!-- Hint fullscreen -->
  <button class="fullscreen-btn" id="fsBtn" type="button" title="Pantalla completa">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
    </svg>
  </button>

  <script>
    // Fullscreen toggle
    const fsBtn = document.getElementById('fsBtn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    // Cámara: simulación
    const camBtn = document.getElementById('cameraBtn');
    const camStatus = document.getElementById('camStatus');
    camBtn.addEventListener('click', () => {
      camStatus.textContent = 'No pudimos encender la cámara.';
      const btn = camBtn.querySelector('.ring');
      btn.style.background = 'var(--color-red)';
      btn.style.color = '#fff';
      camStatus.innerHTML = '<span style="color:var(--color-red)">Pide ayuda al equipo del stand</span><br>Toca para reintentar';
      setTimeout(() => {
        btn.style.background = '';
        btn.style.color = '';
        camStatus.textContent = 'Toca para encender la cámara';
      }, 4000);
    });

    // Clave: E34R es la única válida
    const keyForm = document.getElementById('keyForm');
    const keyInput = document.getElementById('keyInput');
    const keyError = document.getElementById('keyError');

    function submitKey() {
      const val = keyInput.value.trim().toUpperCase();
      if (val === 'E34R') {
        location.href = '2-rumbo.html';
      } else if (val.length === 0) {
        keyError.textContent = '';
      } else {
        keyError.textContent = 'Esa clave no existe, revísala';
        keyInput.parentElement.style.borderColor = 'var(--color-red)';
        setTimeout(() => { keyInput.parentElement.style.borderColor = ''; }, 1500);
      }
    }
    keyInput.addEventListener('input', () => {
      keyError.textContent = '';
      keyInput.value = keyInput.value.toUpperCase();
    });
    keyForm.addEventListener('submit', (e) => { e.preventDefault(); submitKey(); });
    keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitKey(); } });
  </script>
</body>
</html>
